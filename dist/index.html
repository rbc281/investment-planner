<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10234d"><title>Investment Planner | TimeProof USA</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><img src="assets/logo.png" alt="TimeProof USA Home Solutions" class="logo"><nav aria-label="Presentation steps"><button id="navInvestment" class="active"><span>1</span> Investment</button><i></i><button id="navPayment"><span>2</span> Payment options</button></nav></header>
<main><section id="investment"><div class="investment-grid"><div><div class="discount-anchor"><h1><button id="discountTrigger" aria-expanded="false" aria-controls="discountPopover">One Year Investment</button></h1><div id="discountPopover" class="discount-popover" hidden><div class="popover-title">Project savings<button id="closeDiscounts" aria-label="Close discount options">×</button></div><div id="discountOptions"></div></div></div><button class="retail" id="editRetail" aria-label="Edit one year investment">$0</button><div id="discountRows"></div><p id="discountError" class="error" aria-live="polite"></p><div id="customRows"></div></div><aside class="summary"><h2>Your investment</h2><div id="total" class="hero">$0</div><div class="savings">Total savings <strong id="savings">$0</strong></div><button id="next" class="primary">Easy Pay Options <span>→</span></button></aside></div></section>
<section id="payment" hidden><div class="payment-top"><div><h1>Your investment</h1><div id="paymentTotal" class="payment-total">$0</div></div><div class="balance-box"><div class="deposit-row"><label for="deposit">Down payment</label><div class="money-input"><span>$</span><input id="deposit" inputmode="decimal" value="0" aria-describedby="depositError"></div></div><p id="depositError" class="error" aria-live="polite"></p><div class="balance-row"><span id="balanceLabel">Amount to finance</span><strong id="balance">$0</strong></div></div></div><div class="cards" role="group" aria-label="Payment options"><button class="card" data-plan="cash" aria-pressed="false"><span class="check">✓</span><h2>Credit Card or Check</h2><div class="card-price" id="cashBalance">$0</div><p>Remaining balance</p><p class="secondary">After down payment</p></button><button class="card selected" data-plan="monthly" aria-pressed="true"><span class="check">✓</span><h2>Monthly Payments</h2><div class="card-price"><span id="monthly">$0</span><small>/mo</small></div><p>Estimated monthly payment</p><p class="secondary">9.95% APR · 180 months</p><div class="disclosure">Subject to credit approval. Actual terms and payment may vary.</div></button><button class="card" data-plan="promo" aria-pressed="false"><span class="check">✓</span><h2>Same as Cash</h2><div class="card-price">$0</div><p>No payments for 12 months</p><p class="secondary">No interest</p><div class="disclosure">Subject to credit approval. Full promotional balance must be paid before the promotional period ends.</div></button></div><button id="back" class="back">← Back to investment</button></section></main>
<footer><button id="reset" class="text-button">New presentation</button><div class="footer-actions"><a href="investment-planner-offline.html" download id="offline">Download offline</a><button id="settings" class="icon-button" aria-label="Adjust investment and discounts" title="Adjust investment and discounts">☷</button></div></footer></div>
<dialog id="setup"><form id="setupForm"><p class="eyebrow">TIMEPROOF USA</p><h2>Investment Planner</h2><p class="muted">Enter the retail price.</p><label for="retailInput">One Year Investment</label><div class="setup-input money-input"><span>$</span><input id="retailInput" inputmode="decimal" required autofocus></div><p id="setupError" class="error"></p><button class="solid" type="submit">Present investment →</button><button type="button" id="cancelSetup" class="text-button">Cancel</button></form></dialog>
<dialog id="adjust"><form id="adjustForm"><div class="dialog-heading"><h2>Presentation settings</h2><button type="button" id="closeAdjust" aria-label="Close">×</button></div><p class="muted">Rename the options shown in your savings menu.</p><div id="discountSettings"></div><button type="submit" class="solid">Save names</button></form></dialog>
<script src="app.js"></script></body></html>
